[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "rsa-break-lab"
version = "1.0.0"
description = "A cryptanalysis teaching toolkit: generate weak RSA keys and break them with five classic attacks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.5"]

[project.scripts]
rsa-break-lab = "rsa_break_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
